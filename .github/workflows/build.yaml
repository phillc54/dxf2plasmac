name: Build and Release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'The tag version for this release (e.g., v1.2.3)'
        required: true
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # required to create releases


jobs:
  build-windows:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arch: x64
            runner_label: windows-latest
          - os: windows-arm64
            arch: arm64
            runner_label: windows-11-arm
    runs-on: ${{ matrix.runner_label }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          architecture: ${{ matrix.arch }}

      - name: Install Dependencies & PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          # python -m pip install pyinstaller

      - name: Build with PyInstaller
        run: pyinstaller src/dxf2plasmac/main.spec

      - name: Compile Inno Setup Installer
        run: iscc installer.iss

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dxf2plasmac-windows-${{ matrix.arch }}
          path: dist/

