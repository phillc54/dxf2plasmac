name: Build and Release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'The tag version for this release (e.g., v1.2.3)'
        required: true
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # required to create releases


jobs:
  build-macos-arm64:
    name: macOS (ARM64) Build
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          brew install create-dmg

      - name: Build app bundle with pyinstaller
        env:
          MACOS_ARCH: arm64
        run: pyinstaller src/dxf2plasmac/main.spec

      - name: Create dmg disk image
        run: |
          create-dmg \
            --volname "dxf2PlasmaC Installation" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --icon "dxf2PlasmaC.app" 175 190 \
            --app-drop-link 425 190 \
            "dist/dxf2PlasmaC-Mac-ARM64.dmg" \
            "dist/dxf2PlasmaC.app"

      - name: Upload dmg artifact
        uses: actions/upload-artifact@v7
        with:
          name: macos-arm64-dmg
          path: dist/dxf2PlasmaC-Mac-ARM64.dmg


