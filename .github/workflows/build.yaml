name: Package Build and Release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag version for this release (e.g., v1.2.3)'
        required: true
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-macos-arm64:
    name: macOS arm64 build
    runs-on: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r build_scripts/requirements.txt
          brew install create-dmg

      - name: Build app bundle with pyinstaller
        env:
          MACOS_ARCH: arm64
        run: pyinstaller build_scripts/main.spec

      - name: Create dmg disk image
        run: |
          create-dmg \
            --volname "dxf2PlasmaC Installation" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --icon "dxf2PlasmaC.app" 175 190 \
            --app-drop-link 425 190 \
            "dist/dxf2PlasmaC-Mac-arm64.dmg" \
            "dist/dxf2PlasmaC.app"

      - name: Upload dmg artifact
        uses: actions/upload-artifact@v7
        with:
          name: macos-arm64-dmg
          path: dist/dxf2PlasmaC-Mac-arm64.dmg


  build-linux:
    name: Linux matrix build
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            arch: x86_64
            py: x64
            runner_label: ubuntu-22.04
          - os: ubuntu-24.04-arm
            arch: aarch64
            py: arm64
            runner_label: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner_label }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          architecture: ${{ matrix.py }}
          cache: 'pip'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk libfuse2

      - name: Install python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r build_scripts/requirements.txt

      - name: Build app with pyinstaller
        run: pyinstaller build_scripts/main.spec

      - name: Prepare appdir for appimage packaging
        run: |
          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps
          cp -r dist/dxf2PlasmaC/* AppDir/usr/bin/
          cp build_scripts/my-app.desktop AppDir/
          ln -s usr/bin/dxf2PlasmaC AppDir/AppRun
          cp src/assets/dxf2plasmac.png AppDir/usr/share/icons/hicolor/256x256/apps/dxf2plasmac.png
          cp src/assets/dxf2plasmac.png AppDir/.DirIcon
          cp src/assets/dxf2plasmac.png AppDir/

      - name: Download appimagetool and build package
        run: |
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-${{ matrix.arch }}.AppImage
          chmod +x appimagetool-${{ matrix.arch }}.AppImage
          export ARCH=${{ matrix.arch }}
          ./appimagetool-${{ matrix.arch }}.AppImage AppDir dxf2PlasmaC-Linux-${{ matrix.arch }}.AppImage

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dxf2plasmac-linux-${{ matrix.arch }}
          path: dxf2PlasmaC-Linux-${{ matrix.arch }}.AppImage


  build-windows:
    name: windows matrix build
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arch: x64
            runner_label: windows-latest
          - os: windows-arm64
            arch: arm64
            runner_label: windows-11-arm
    runs-on: ${{ matrix.runner_label }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          architecture: ${{ matrix.arch }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r build_scripts/requirements.txt

      - name: Build with pyinstaller
        run: pyinstaller build_scripts/main.spec

      - name: Compile inno setup installer
        run: iscc build_scripts/installer.iss

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dxf2plasmac-windows-${{ matrix.arch }}
          path: dist/


  release:
    name: Prepare release
    needs: [build-macos-arm64, build-linux, build-windows]
    runs-on: ubuntu-24.04
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Place packages in a release directory
        run: |
          mkdir release
          cp artifacts/macos-arm64-dmg/dxf2PlasmaC-Mac-arm64.dmg release/
          cp artifacts/dxf2plasmac-linux-x86_64/dxf2PlasmaC-Linux-x86_64.AppImage release/
          cp artifacts/dxf2plasmac-linux-aarch64/dxf2PlasmaC-Linux-aarch64.AppImage release/
          cp artifacts/dxf2plasmac-windows-x64/dxf2PlasmaC-Setup.exe release/dxf2PlasmaC-Windows-x64-Setup.exe
          cp artifacts/dxf2plasmac-windows-arm64/dxf2PlasmaC-Setup.exe release/dxf2PlasmaC-Windows-arm64-Setup.exe

      - name: Publish to github repo
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          generate_release_notes: false
          body: |
            - None of these packages are signed.

            - macOS packages requires the following after installing:
              xattr -dr com.apple.quarantine /Applications/dxf2PlasmaC.app
          files:
            release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
