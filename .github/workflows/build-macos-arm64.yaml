name:  Build macOS-arm64

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'The tag version for this release (e.g., v1.2.3)'
        required: true
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # required to create releases

jobs:
  build-macos-arm64:
    name: macOS (ARM64) Build
    runs-on: macos-latest # GitHub macOS runners natively execute on M-series Apple Silicon ARM architecture
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          brew install create-dmg

      - name: Build App Bundle with PyInstaller
        env:
          MACOS_ARCH: arm64
        run: pyinstaller src/dxf2plasmac/main.spec

      - name: Create DMG Disk Image
        run: |
          create-dmg \
            --volname "dxf2PlasmaC Installation" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --icon "dxf2PlasmaC.app" 175 190 \
            --app-drop-link 425 190 \
            "dist/dxf2PlasmaC-Mac-ARM64.dmg" \
            "dist/dxf2PlasmaC.app"

      - name: Create GitHub Release and Upload DMG
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          generate_release_notes: true
          files: dist/dxf2PlasmaC-Mac-ARM64.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
