name: Build Windows-64

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'The tag version for this release (e.g., v1.2.3)'
        required: true
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # required to create releases

jobs:
  build-windows-64:
    name: Windows 64 Build
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build App Folder with PyInstaller
        run: pyinstaller src/dxf2plasmac/main.spec

      - name: Compile Inno Setup Installer
        run: iscc installer.iss

      - name: Upload Installer Artifact
        uses: actions/upload-artifact@v7
        with:
          name: windows-64-installer
          path: dist/dxf2PlasmaC-Setup.exe

  release:
    name: Release
    needs: [build-windows-64]
    runs-on: ubuntu-22.04
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publish Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          generate_release_notes: true
          # files: dist/dxf2PlasmaC-Setup.exe
          files: artifacts/windows-64-installer
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
