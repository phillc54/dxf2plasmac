name: Build Windows-arm64

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'The tag version for this release (e.g., v1.2.3)'
        required: true
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # required to create releases

jobs:
  build-windows-arm64:
    name: Windows arm64 Build
    runs-on: windows-11-arm

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14.10'
          architecture: 'arm64' # Python cross-compiles Windows binaries based on architecture flag
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build App Folder with PyInstaller
        run: pyinstaller src/dxf2plasmac/main.spec

      - name: Compile Inno Setup Installer
        run: iscc installer.iss
        # Note: To fully lock down the ARM64 MSI installer layer, you can create a second
        # installer.iss file using 'ArchitecturesAllowed=arm64' if desired.

      - name: Upload Installer Artifact
        uses: actions/upload-artifact@v7
        with:
          name: windows-arm64-installer
          path: dist/dxf2PlasmaC-Setup.exe

      - name: Create GitHub Release and Upload DMG
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          generate_release_notes: true
          files: dist/dxf2PlasmaC-Mac-ARM64.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
