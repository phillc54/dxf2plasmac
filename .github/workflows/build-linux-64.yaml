name: Build Linux-64

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-linux-64:
    name: Linux (x86_64) AppImage Build
    runs-on: ubuntu-22.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: 'pip'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk libfuse2

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build App with PyInstaller
        run: pyinstaller src/dxf2plasmac/main.spec

      - name: Structure AppDir for AppImage Packaging
        run: |
          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps
          cp -r dist/dxf2PlasmaC/* AppDir/usr/bin/
          cp my-app.desktop AppDir/
          ln -s usr/bin/dxf2PlasmaC AppDir/AppRun
          cp src/dxf2plasmac/assets/dxf2plasmac.png AppDir/usr/share/icons/hicolor/256x256/apps/dxf2plasmac.png
          cp src/dxf2plasmac/assets/dxf2plasmac.png AppDir/.DirIcon

      - name: Download appimagetool and Build Package
        run: |
          wget -q https://github.com
          chmod +x appimagetool-x86_64.AppImage
          export ARCH=x86_64
          ./appimagetool-x86_64.AppImage AppDir dxf2PlasmaC-Linux-x86_64.AppImage

      - name: Upload AppImage Artifact
        uses: actions/upload-artifact@v7
        with:
          name: linux-x86_64-appimage
          path: dxf2PlasmaC-Linux-x86_64.AppImage


  release:
    name: Publish Release Hub
    needs: [build-linux-64]
    runs-on: ubuntu-latest
    steps:
      - name: Download All Pipeline Artifacts
        uses: actions/download-artifact@v8
        with:
          path: raw_artifacts

      - name: Organize Deployment Architecture Manifest Files
        run: |
          mkdir release
          # Rename and match artifacts systematically into a unified distribution bucket
          cp raw_artifacts/linux-x86_64-appimage/dxf2PlasmaC-Linux-x86_64.AppImage release/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
