name: Build Linux-64

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'The tag version for this release (e.g., v1.2.3)'
        required: true
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # required to create releases

jobs:
  build-linux-64:
    name: Linux x86_64 Build
    runs-on: ubuntu-22.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: 'pip'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk libfuse2

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build App with PyInstaller
        run: pyinstaller src/dxf2plasmac/main.spec

      - name: Structure AppDir for AppImage Packaging
        run: |
          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps
          cp -r dist/dxf2PlasmaC/* AppDir/usr/bin/
          cp my-app.desktop AppDir/
          ln -s usr/bin/dxf2PlasmaC AppDir/AppRun
          cp src/dxf2plasmac/assets/dxf2plasmac.png AppDir/usr/share/icons/hicolor/256x256/apps/dxf2plasmac.png
          cp src/dxf2plasmac/assets/dxf2plasmac.png AppDir/.DirIcon

      - name: Download appimagetool and Build Package
        run: |
          # wget -q https://github.com
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          export ARCH=x86_64
          ./appimagetool-x86_64.AppImage AppDir dxf2PlasmaC-Linux-x86_64.AppImage

      - name: Upload AppImage Artifact
        uses: actions/upload-artifact@v7
        with:
          name: linux-x86_64-appimage
          path: dxf2PlasmaC-Linux-x86_64.AppImage

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Print resulting directory structure
        run: |
          echo "=== Using find ==="
          find artifacts -print

      - name: Create GitHub Release and Upload DMG
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          generate_release_notes: true
          files: artifacts/dxf2PlasmaC-Linux-x86_64.AppImage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
